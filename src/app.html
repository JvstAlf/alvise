<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="assets/icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="title" content="Alvise Zurlandi">
        <meta name="description" content="Alvise Zurlandi portfolio">
        <meta name="keywords" content="alvise zurlandi, alvise, zurlandi, portfolio, personal, website, venice, art, graphic, designer, web, developer">
        <meta name="robots" content="index, follow">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="language" content="English">
		%sveltekit.head%
	</head>
	
	<body>%sveltekit.body%
	</body>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			scroll-behavior: smooth;
		}

		html {
			cursor: none;
			overflow-x: hidden;
		}
	</style>

	<script>
		if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
	
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
	
    if (window.location.hash && document.getElementById(window.location.hash.substring(1))) {
    history.replaceState('', document.title, window.location.pathname);
  }
	</script>

	<noscript>Enable script loading to load the website</noscript>

</html>
